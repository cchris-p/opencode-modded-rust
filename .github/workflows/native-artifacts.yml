name: Native artifacts

# INFRA-006: build the native ScopeMux provider bundle and the CLI binary once,
# then publish them so machines can download prebuilt artifacts instead of
# cloning scopemux-core and compiling the C provider per machine.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish assets to the native-artifacts release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/native-artifacts.yml"
      - "crates/opencode-scopemux/**"
      - "scripts/fetch-scopemux-core.sh"
      - "scripts/package-native-artifacts.sh"
      - "scripts/ensure-native-artifacts.sh"

permissions:
  contents: write

concurrency:
  group: native-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            deps: |
              sudo add-apt-repository -y ppa:deadsnakes/ppa
              sudo apt-get update
              sudo apt-get install -y cmake python3.11-dev
          # macOS bundle re-enabled once the pin advanced past scopemux-core#36
          # (label-followed-by-declaration, a C23 extension that the runner's
          # older AppleClang rejected).
          - os: macos-14
            deps: |
              brew install cmake python@3.11
              echo "$(brew --prefix python@3.11)/bin" >> "$GITHUB_PATH"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: ${{ matrix.deps }}

      # scopemux-core and its required grammar/pybind11 submodules are public, so
      # clones go over anonymous HTTPS (the script's default is SSH). If
      # scopemux-core is ever made private, add token auth here.
      - name: Fetch pinned scopemux-core
        env:
          SCOPEMUX_CORE_REPO: https://github.com/cchris-p/scopemux-core.git
        run: bash scripts/fetch-scopemux-core.sh

      - name: Package native provider artifacts
        run: bash scripts/package-native-artifacts.sh --no-fetch --out native-dist

      - name: Build CLI binary (release)
        run: cargo build --release -p opencode-cli

      - name: Package CLI binary
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in x86_64|amd64) arch=x86_64 ;; arm64|aarch64) arch=aarch64 ;; esac
          pkg="opencode-modded-rust-${os}-${arch}"
          mkdir -p bin-dist
          cp target/release/opencode-modded-rust bin-dist/
          tar -C bin-dist -czf "native-dist/${pkg}.tar.gz" opencode-modded-rust
          if command -v shasum >/dev/null 2>&1; then
            ( cd native-dist && shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          else
            ( cd native-dist && sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: native-dist/*
          if-no-files-found: error

      - name: Publish to the native-artifacts release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view native-artifacts --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create native-artifacts \
              --repo "$GITHUB_REPOSITORY" \
              --title "Native artifacts" \
              --notes "Prebuilt native ScopeMux provider bundles and CLI binaries (INFRA-006). Assets are keyed by platform and the pinned scopemux-core revision."
          gh release upload native-artifacts native-dist/*.tar.gz native-dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
