name: Release retry

# INFRA-016: a hosted macOS runner that stays queued past the job timeout gets
# cancelled, which cancels the Linux build and skips `publish`. That made every
# release so far require a manual macOS recovery. Hosted capacity is transient, so
# retry the same run after a delay instead of asking a human to rebuild.
#
# The retry uses this workflow's own GITHUB_TOKEN with `actions: write`, so the
# automatic path never depends on a personal token permission.
#
# Note: `workflow_run` only fires for a workflow that exists on the default
# branch, so this takes effect for the first release merged to `main` after it.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: release-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: retry
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Decide whether to retry
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "retry=false" >> "$GITHUB_OUTPUT"
          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "not a main release (head '$HEAD_BRANCH'); nothing to retry"
            exit 0
          fi
          if [ "${ATTEMPT:-1}" -ge 3 ]; then
            echo "::error::release attempt $ATTEMPT exhausted; manual recovery required"
            exit 0
          fi
          jobs="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs)"
          published="$(printf '%s' "$jobs" \
            | jq -r '[.jobs[] | select(.name == "publish" and .conclusion == "success")] | length > 0')"
          if [ "$published" = "true" ]; then
            echo "release already published; not retrying"
            exit 0
          fi
          echo "attempt ${ATTEMPT:-1}: retrying run $RUN_ID"
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Wait for hosted runner capacity
        if: steps.decide.outputs.retry == 'true'
        run: sleep 600

      - name: Retry the failed release run
        if: steps.decide.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY"
